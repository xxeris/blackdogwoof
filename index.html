<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>黑狗汪汪</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #efeae0; color: #222;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; user-select: none;
  }
  h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: 2px; }
  #wrap { position: relative; width: 900px; max-width: 100%; }
  canvas { display: block; width: 100%; background: #fff; border: 3px solid #222; border-radius: 10px; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(255,255,255,.93); border-radius: 10px; text-align: center; padding: 16px;
  }
  .overlay h2 { margin: 0; font-size: 28px; }
  .overlay p { margin: 0; color: #555; }
  input {
    font: inherit; font-size: 20px; padding: 8px 14px; width: 240px; max-width: 80%;
    border: 2px solid #222; border-radius: 8px; text-align: center; outline: none;
  }
  input:focus { box-shadow: 0 0 0 3px #f5c542; }
  button {
    font: inherit; font-size: 18px; padding: 8px 22px; border: 2px solid #222; border-radius: 8px;
    background: #222; color: #fff; cursor: pointer;
  }
  button.secondary { background: #fff; color: #222; }
  button:hover { filter: brightness(1.15); }
  .keys { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin-top: 12px; font-size: 15px; }
  .keys span { white-space: nowrap; }
  kbd {
    display: inline-block; min-width: 26px; padding: 2px 7px; border: 2px solid #222; border-bottom-width: 4px;
    border-radius: 6px; background: #fff; font-family: inherit; font-weight: bold; text-align: center;
  }
  .hidden { display: none !important; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
  /* ---------- 手機觸控按鍵 ---------- */
  #pad { display: none; }
  .pad-group { display: flex; flex-direction: column; gap: 14px; }
  .pad-btn {
    width: 84px; height: 84px; border-radius: 50%; padding: 0; font-size: 30px; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: #222; color: #fff; border: 3px solid #222;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad-btn small { font-size: 12px; }
  .pad-btn.active { transform: scale(.92); background: #f5c542; color: #222; }

  /* 手機:遊戲畫面全螢幕,依螢幕比例調整 */
  @media (pointer: coarse) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { padding: 0; background: #fff; touch-action: none; }
    h1, .keys { display: none; }
    #wrap { position: fixed; inset: 0; width: 100%; max-width: none; }
    canvas { width: 100%; height: 100%; border: 0; border-radius: 0; }
    /* 直式:按鍵在地面下方的土地區 */
    #pad {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      height: calc(210px + env(safe-area-inset-bottom, 0px));
      justify-content: space-between; align-items: center;
      padding: 12px max(24px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
    }
    .overlay { position: fixed; inset: 0; border-radius: 0; z-index: 20; }
  }
  /* 橫式:按鍵半透明,排成一列在畫面最下方,不擋到遊戲 */
  @media (pointer: coarse) and (orientation: landscape) {
    #pad {
      height: calc(80px + env(safe-area-inset-bottom, 0px));
      padding: 7px max(20px, env(safe-area-inset-right, 0px)) calc(7px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    }
    .pad-group { flex-direction: row; gap: 14px; }
    .pad-btn { opacity: .5; width: 66px; height: 66px; font-size: 22px; }
    .pad-btn.active { opacity: .85; }
  }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  #exitScreen {
    position: fixed; inset: 0; background: #000; color: #888; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; font-size: 20px;
  }
</style>
</head>
<body>
<h1>🐕 黑狗汪汪</h1>
<div id="wrap">
  <canvas id="c" width="900" height="300"></canvas>

  <div id="nameScreen" class="overlay">
    <h2>幫你的黑狗取個名字</h2>
    <input id="nameInput" maxlength="10" placeholder="輸入名字…" autocomplete="off">
    <button id="startBtn">開始遊戲</button>
    <p>按 Enter 也可以開始</p>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h2 id="overTitle">遊戲結束</h2>
    <p id="overReason"></p>
    <p id="overScore" style="font-size:22px;color:#222"></p>
    <div style="display:flex;gap:10px">
      <button id="retryBtn">再玩一次 (Enter)</button>
      <button id="renameBtn" class="secondary">換名字</button>
    </div>
  </div>
</div>

<div class="keys">
  <span><kbd>W</kbd> 對天上的鳥吠叫 +50</span>
  <span><kbd>S</kbd> 對地上的小孩吠叫 +50</span>
  <span><kbd>Shift</kbd> 趴下躲子彈 +100</span>
  <span><kbd>Space</kbd> 跳過捕獸夾 +100</span>
</div>

<div id="pad">
  <div class="pad-group">
    <button class="pad-btn" data-code="KeyW">▲<small>吠鳥</small></button>
    <button class="pad-btn" data-code="KeyS">▼<small>吠小孩</small></button>
  </div>
  <div class="pad-group">
    <button class="pad-btn" data-code="Space">跳<small>捕獸夾</small></button>
    <button class="pad-btn" data-code="ShiftLeft">蹲<small>子彈</small></button>
  </div>
</div>

<div id="fade"></div>
<div id="safe"></div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const DOG_X = 90;
  const EGG_NAME = '姜博凱';
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  // 世界座標:W/H/GROUND 會隨螢幕大小改變(電腦固定 900x300)
  let W = 900, H = 300, GROUND = 250, SCALE = 1, SPEED_K = 1;
  const safe = { t: 0, l: 0, r: 0 };
  let clouds = [], hillOff = 0;
  const LABEL = isTouch
    ? { bird: '▲', kid: '▼', bullet: '蹲', trap: '跳', duck: '按「蹲」', jump: '按「跳」' }
    : { bird: 'W', kid: 'S', bullet: 'Shift', trap: 'Space', duck: '按 Shift 趴下', jump: '按 Space 跳過' };

  const $ = id => document.getElementById(id);
  const nameScreen = $('nameScreen'), overScreen = $('overScreen'), nameInput = $('nameInput');

  let best = 0;
  try { best = +localStorage.getItem('blackDogBest') || 0; } catch (e) {}

  // ---------- 音效 ----------
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    return actx;
  }
  function tone(freqFrom, freqTo, dur, type = 'sawtooth', vol = 0.15, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freqFrom, t);
    o.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    bark() { tone(520, 220, 0.12); tone(560, 240, 0.12, 'sawtooth', 0.15, 0.15); },
    jump() { tone(300, 600, 0.12, 'square', 0.06); },
    point() { tone(880, 1320, 0.1, 'triangle', 0.1); },
    hit() { tone(300, 60, 0.4, 'square', 0.15); },
    horn() { tone(420, 400, 0.25, 'square', 0.12); tone(420, 400, 0.35, 'square', 0.12, 0.3); },
    crash() { tone(200, 40, 0.6, 'sawtooth', 0.25); tone(900, 100, 0.3, 'square', 0.1, 0.05); },
  };

  // ---------- 畫面尺寸 ----------
  const cloudY = () => 20 + Math.random() * Math.max(40, GROUND - 200);
  function makeClouds() {
    const n = Math.max(3, Math.round((W * GROUND) / 60000));
    clouds = Array.from({ length: n }, () => ({ x: Math.random() * W, y: cloudY() }));
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    let cssW = 900, cssH = 300, newGround = 250;
    if (isTouch) {
      cssW = window.innerWidth; cssH = window.innerHeight;
      const band = $('pad').getBoundingClientRect().height;
      const groundPx = cssH - band;
      // 地面以上至少留 250 單位給遊戲,寬度至少看得到 520 單位
      SCALE = Math.min(groundPx / 250, cssW / 520);
      W = cssW / SCALE; H = cssH / SCALE;
      newGround = groundPx / SCALE;
      const cs = getComputedStyle($('safe'));
      safe.t = parseFloat(cs.paddingTop) / SCALE || 0;
      safe.l = parseFloat(cs.paddingLeft) / SCALE || 0;
      safe.r = parseFloat(cs.paddingRight) / SCALE || 0;
    } else {
      SCALE = 1; W = 900; H = 300;
    }
    // 轉向時把場上物件跟著地面移動
    const dy = newGround - GROUND;
    if (dy && g) { for (const o of g.obs) o.y += dy; for (const p of g.pops) p.y += dy; }
    GROUND = newGround;
    SPEED_K = Math.max(0.58, Math.min(1, W / 900)); // 畫面窄時速度跟著縮,反應時間不變
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr * SCALE, 0, 0, dpr * SCALE, 0, 0);
    makeClouds();
  }

  function goFullscreen() {
    if (!isTouch || document.fullscreenElement) return;
    const el = document.documentElement;
    try {
      const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el, { navigationUI: 'hide' });
      if (r && r.catch) r.catch(() => {});
    } catch (e) {}
  }

  // ---------- 狀態 ----------
  let mode = 'name';      // name | play | over | egg | exit
  let dogName = '';
  let g;                  // 遊戲狀態
  const keys = {};

  function newGame() {
    g = {
      t: 0, score: 0, speed: 6,
      dogY: 0, vy: 0, duck: false, bark: 0, barkText: '',
      obs: [], pops: [], nextSpawn: 60, lastDanger: -999,
      groundOff: 0,
    };
  }

  // ---------- 輸入 ----------
  function press(code) {
    if (keys[code]) return; // 避免長按重複觸發
    keys[code] = true;
    if (mode === 'play') {
      if (code === 'KeyW') bark('sky');
      if (code === 'KeyS') bark('ground');
      if (code === 'Space' && g.dogY === 0) { g.vy = -12.5; sfx.jump(); }
    } else if (mode === 'over' && code === 'Enter') {
      startPlay();
    }
  }
  function release(code) { keys[code] = false; }

  window.addEventListener('keydown', e => {
    if (document.activeElement === nameInput) return;
    if (['Space', 'ShiftLeft', 'ShiftRight', 'KeyW', 'KeyS'].includes(e.code)) e.preventDefault();
    press(e.code);
  });
  window.addEventListener('keyup', e => release(e.code));

  // 觸控按鍵
  document.querySelectorAll('.pad-btn').forEach(b => {
    const code = b.dataset.code;
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (err) {}
      b.classList.add('active');
      audio();
      press(code);
    });
    const up = () => { b.classList.remove('active'); release(code); };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submitName(); });
  $('startBtn').onclick = submitName;
  $('retryBtn').onclick = startPlay;
  $('renameBtn').onclick = () => {
    mode = 'name'; overScreen.classList.add('hidden'); nameScreen.classList.remove('hidden');
    nameInput.value = ''; nameInput.focus();
  };

  function submitName() {
    const n = nameInput.value.trim();
    if (!n) { nameInput.focus(); return; }
    dogName = n;
    audio();
    goFullscreen();
    nameInput.blur();
    nameScreen.classList.add('hidden');
    if (n === EGG_NAME) startEgg(); else startPlay();
  }

  function startPlay() {
    goFullscreen();
    newGame();
    overScreen.classList.add('hidden');
    mode = 'play';
  }

  function bark(where) {
    g.bark = 18;
    sfx.bark();
    // 找吠叫範圍內最近的目標
    const target = g.obs
      .filter(o => o.type === (where === 'sky' ? 'bird' : 'kid') && !o.scared && o.x > DOG_X - 10 && o.x < Math.min(DOG_X + 380, W))
      .sort((a, b) => a.x - b.x)[0];
    if (target) {
      target.scared = true;
      addScore(50, target.x, target.y - 30, where === 'sky' ? '+50 嚇跑鳥!' : '+50 嚇跑小孩!');
    }
  }

  function addScore(n, x, y, text) {
    g.score += n;
    g.pops.push({ x, y, text, life: 50 });
    sfx.point();
  }

  function gameOver(reason) {
    mode = 'over';
    sfx.hit();
    if (g.score > best) { best = g.score; try { localStorage.setItem('blackDogBest', best); } catch (e) {} }
    $('overTitle').textContent = `${dogName} 倒下了!`;
    $('overReason').textContent = reason;
    $('overScore').textContent = `分數 ${g.score}　最高分 ${best}`;
    setTimeout(() => { if (mode === 'over') overScreen.classList.remove('hidden'); }, 600);
  }

  // ---------- 生成障礙 ----------
  function spawn() {
    const r = Math.random();
    let type = r < 0.25 ? 'bird' : r < 0.5 ? 'kid' : r < 0.75 ? 'bullet' : 'trap';
    const x = W + 30;
    // 危險物抵達狗的時間要錯開,避免同時要跳又要趴
    if (type === 'bullet' || type === 'trap') {
      const v = (type === 'bullet' ? g.speed + 5 : g.speed) * SPEED_K;
      const arrive = g.t + (x - DOG_X) / v;
      if (Math.abs(arrive - g.lastDanger) < 45) type = Math.random() < 0.5 ? 'bird' : 'kid';
      else g.lastDanger = arrive;
    }
    const o = { type, x, scared: false, passed: false, ph: Math.random() * 6 };
    if (type === 'bird') { o.y = GROUND - 190 + Math.random() * 50; o.w = 36; o.h = 20; }
    if (type === 'kid') { o.y = GROUND; o.w = 24; o.h = 50; }
    if (type === 'bullet') { o.y = GROUND - 42; o.w = 22; o.h = 8; }
    if (type === 'trap') { o.y = GROUND; o.w = 44; o.h = 16; }
    g.obs.push(o);
  }

  // ---------- 更新 ----------
  function dogBox() {
    const top = g.duck ? GROUND - 26 : GROUND - 52;
    return { x1: DOG_X + 10, x2: DOG_X + 74, y1: top + g.dogY, y2: GROUND + g.dogY - 2 };
  }

  function update(dt) {
    g.t += dt;
    g.speed = Math.min(14, 6 + g.t * 0.0025);
    const sp = g.speed * SPEED_K;
    g.groundOff = (g.groundOff + sp * dt) % 40;
    hillOff += sp * 0.15 * dt;
    for (const c of clouds) { c.x -= 0.6 * dt; if (c.x < -80) { c.x = W + 60; c.y = cloudY(); } }

    // 狗的物理
    const shift = keys.ShiftLeft || keys.ShiftRight;
    g.duck = shift && g.dogY === 0;
    if (g.dogY < 0 || g.vy < 0) {
      g.vy += (shift ? 1.4 : 0.6) * dt; // 空中按 Shift 加速下墜
      g.dogY += g.vy * dt;
      if (g.dogY >= 0) { g.dogY = 0; g.vy = 0; }
    }
    if (g.bark > 0) g.bark -= dt;

    // 生成
    g.nextSpawn -= dt;
    if (g.nextSpawn <= 0) {
      spawn();
      g.nextSpawn = (55 + Math.random() * 70) * (6 / g.speed) + 20;
    }

    const box = dogBox();
    for (const o of g.obs) {
      o.ph += 0.25 * dt;
      if (o.type === 'bullet') o.x -= (g.speed + 5) * SPEED_K * dt;
      else if (o.scared && o.type === 'bird') { o.x -= (g.speed - 2) * SPEED_K * dt; o.y -= 4 * dt; }
      else if (o.scared && o.type === 'kid') { o.x += 3 * dt; }
      else o.x -= sp * dt;

      if (o.type === 'bullet' || o.type === 'trap') {
        const ox1 = o.x, ox2 = o.x + o.w, oy1 = o.y - (o.type === 'trap' ? o.h : 0), oy2 = o.type === 'trap' ? o.y : o.y + o.h;
        if (box.x1 < ox2 && box.x2 > ox1 && box.y1 < oy2 && box.y2 > oy1) {
          gameOver(o.type === 'bullet' ? `被子彈打中了…下次記得${LABEL.duck}!` : `踩到捕獸夾了…下次記得${LABEL.jump}!`);
          return;
        }
        if (!o.passed && ox2 < box.x1) {
          o.passed = true;
          addScore(100, DOG_X + 30, GROUND - 80, o.type === 'bullet' ? '+100 閃過子彈!' : '+100 跳過夾子!');
        }
      }
    }
    g.obs = g.obs.filter(o => o.x > -80 && o.x < W + 200 && o.y > -50);
    for (const p of g.pops) { p.life -= dt; p.y -= 0.8 * dt; }
    g.pops = g.pops.filter(p => p.life > 0);
  }

  // ---------- 繪圖 ----------
  function drawBackground(groundOff) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    // 天空很高(直式)時加上太陽
    if (GROUND > 400) {
      ctx.fillStyle = '#fbe7a6';
      ctx.beginPath(); ctx.arc(W - 80 - safe.r, Math.max(90, GROUND * 0.22), 34, 0, Math.PI * 2); ctx.fill();
    }
    // 遠方山丘
    ctx.fillStyle = '#f1efe9';
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W + 10; x += 10) {
      const k = x + hillOff;
      ctx.lineTo(x, GROUND - 40 - Math.sin(k / 90) * 18 - Math.sin(k / 37) * 8);
    }
    ctx.lineTo(W, GROUND); ctx.fill();
    // 地面下的土地
    ctx.fillStyle = '#f6f1e7'; ctx.fillRect(0, GROUND + 2, W, H - GROUND);
    ctx.fillStyle = '#e6e6e6';
    for (const c of clouds) {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 34, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 20, c.y - 8, 20, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND + 1); ctx.lineTo(W, GROUND + 1); ctx.stroke();
    ctx.fillStyle = '#999';
    for (let x = -groundOff; x < W; x += 40) {
      ctx.fillRect(x, GROUND + 8, 10, 2);
      ctx.fillRect(x + 22, GROUND + 16, 5, 2);
    }
  }

  function drawDog(x, y, { duck = false, phase = 0, barking = false, flat = 0, name = '' } = {}) {
    ctx.save();
    ctx.translate(x, y);
    if (flat > 0) { ctx.translate(0, 0); ctx.scale(1 + flat * 0.4, 1 - flat * 0.88); }
    ctx.fillStyle = '#151515';
    const leg = Math.sin(phase) * 5;
    if (duck) {
      ctx.beginPath(); ctx.ellipse(36, -12, 34, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(70, -14, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(74, -16, 16, 8);
      ctx.beginPath(); ctx.moveTo(62, -22); ctx.lineTo(56, -14); ctx.lineTo(66, -16); ctx.fill(); // 貼平的耳朵
      ctx.fillRect(14, -6, 10, 6); ctx.fillRect(50, -6, 10, 6);
      ctx.strokeStyle = '#151515'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(4, -12); ctx.lineTo(-10, -10); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(73, -17, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d33'; ctx.fillRect(60, -12, 4, 8);
    } else {
      // 尾巴
      ctx.strokeStyle = '#151515'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(10, -32); ctx.quadraticCurveTo(-4, -40, -6 + Math.sin(phase * 2) * 3, -54); ctx.stroke();
      // 腿
      ctx.fillRect(14 + leg, -18, 8, 18); ctx.fillRect(24 - leg, -18, 8, 18);
      ctx.fillRect(50 - leg, -18, 8, 18); ctx.fillRect(58 + leg, -18, 8, 18);
      // 身體
      ctx.beginPath(); ctx.ellipse(38, -28, 30, 13, 0, 0, Math.PI * 2); ctx.fill();
      // 頭
      ctx.beginPath(); ctx.arc(68, -42, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(72, -44, 16, barking ? 6 : 10);
      if (barking) { ctx.save(); ctx.translate(72, -36); ctx.rotate(0.35); ctx.fillRect(0, 0, 15, 4); ctx.restore(); }
      // 耳朵
      ctx.beginPath(); ctx.moveTo(60, -52); ctx.lineTo(56, -66); ctx.lineTo(68, -54); ctx.fill();
      // 眼睛、鼻子、項圈
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(72, -46, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#555'; ctx.fillRect(85, -45, 4, 4);
      ctx.fillStyle = '#d33'; ctx.fillRect(56, -38, 6, 12);
      ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(60, -25, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    if (barking && !flat) {
      ctx.save();
      ctx.font = 'bold 20px "Microsoft JhengHei", sans-serif';
      ctx.fillStyle = '#222';
      ctx.fillText('汪!汪!', x + 92, y + (duck ? -18 : -54));
      ctx.restore();
    }
    if (name) {
      ctx.save();
      ctx.font = '13px "Microsoft JhengHei", sans-serif';
      ctx.fillStyle = '#666'; ctx.textAlign = 'center';
      ctx.fillText(name, x + 40, y + (duck ? -32 : flat ? -14 : -72));
      ctx.restore();
    }
  }

  function drawBird(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    const flap = Math.sin(o.ph * (o.scared ? 2 : 1)) * 10;
    ctx.fillStyle = '#4a7bd1';
    ctx.beginPath(); ctx.ellipse(18, 0, 15, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -3, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f0a020'; ctx.beginPath(); ctx.moveTo(-3, -4); ctx.lineTo(-10, -1); ctx.lineTo(-3, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(3, -5, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2f5aa8'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(24, -6 - flap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(40, -3); ctx.stroke();
    if (o.scared) { ctx.fillStyle = '#d33'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('!!', 10, -16); }
    else { ctx.fillStyle = '#bbb'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(LABEL.bird, 14, -14); }
    ctx.restore();
  }

  function drawKid(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    const step = Math.sin(o.ph) * 4;
    ctx.fillStyle = '#334';
    ctx.fillRect(4 + step, -16, 6, 16); ctx.fillRect(14 - step, -16, 6, 16);
    ctx.fillStyle = o.scared ? '#e06060' : '#3aa36b';
    ctx.fillRect(2, -36, 20, 22);
    ctx.fillStyle = '#f2c9a0';
    ctx.beginPath(); ctx.arc(12, -44, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(3, -54, 18, 5);
    ctx.fillStyle = '#222';
    if (o.scared) {
      ctx.fillRect(13, -46, 3, 3); // 轉身逃跑,只看到一隻眼
      ctx.fillStyle = '#5ab0ff'; ctx.beginPath(); ctx.arc(18, -40 + (o.ph % 3) * 3, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d33'; ctx.font = 'bold 13px "Microsoft JhengHei", sans-serif'; ctx.fillText('哇~', 20, -58);
    } else {
      ctx.fillRect(6, -46, 2.5, 2.5); ctx.fillRect(11, -46, 2.5, 2.5);
      ctx.fillStyle = '#bbb'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(LABEL.kid, 8, -60);
    }
    ctx.restore();
  }

  function drawBullet(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(26 + i * 8, 1 + i * 3); ctx.lineTo(40 + i * 12, 1 + i * 3); ctx.stroke(); }
    ctx.fillStyle = '#c89b3c'; ctx.fillRect(6, 0, 16, 8);
    ctx.fillStyle = '#8a8a8a';
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.quadraticCurveTo(-4, 4, 6, 8); ctx.fill();
    ctx.fillStyle = '#bbb'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(LABEL.bullet, 0, -6);
    ctx.restore();
  }

  function drawTrap(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.fillStyle = '#666'; ctx.fillRect(0, -4, o.w, 4);
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.moveTo(2, -4);
    for (let i = 0; i <= 6; i++) ctx.lineTo(2 + i * 6.6 + 3.3, i % 2 ? -16 : -8);
    ctx.lineTo(o.w - 2, -4); ctx.fill();
    ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.w / 2, -4, 18, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#bbb'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(LABEL.trap, 4, -26);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    // 直式時把分數放在靠近遊戲區的位置,不要放在螢幕最頂端
    const top = Math.max(28 + safe.t, GROUND - 320), left = 16 + safe.l, right = W - 16 - safe.r;
    ctx.font = 'bold 18px "Microsoft JhengHei", monospace';
    ctx.fillStyle = '#222'; ctx.textAlign = 'right';
    ctx.fillText(`分數 ${String(g.score).padStart(5, '0')}`, right, top);
    ctx.fillStyle = '#888';
    ctx.fillText(`最高 ${String(Math.max(best, g.score)).padStart(5, '0')}`, right, top + 22);
    ctx.textAlign = 'left'; ctx.fillStyle = '#222';
    ctx.fillText(`🐕 ${dogName}`, left, top);
    ctx.restore();
    for (const p of g.pops) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life / 20);
      ctx.font = 'bold 16px "Microsoft JhengHei", sans-serif';
      ctx.fillStyle = p.text.includes('100') ? '#d9822b' : '#2f8f5b';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }

  function renderGame() {
    drawBackground(g.groundOff);
    for (const o of g.obs) {
      if (o.type === 'bird') drawBird(o);
      else if (o.type === 'kid') drawKid(o);
      else if (o.type === 'trap') drawTrap(o);
    }
    drawDog(DOG_X, GROUND + g.dogY, {
      duck: g.duck, phase: g.dogY === 0 && mode === 'play' ? g.t * 0.45 : 0, barking: g.bark > 0,
    });
    for (const o of g.obs) if (o.type === 'bullet') drawBullet(o);
    drawHUD();
  }

  // ---------- 彩蛋:被車輾過 ----------
  let egg;
  function startEgg() {
    mode = 'egg';
    egg = { t: 0, dogX: -100, carX: W + 260, flat: 0, honked: false, crashed: false, fading: false };
  }

  function updateEgg(dt) {
    const e = egg;
    e.t += dt;
    if (e.t < 90) e.dogX = Math.min(W / 2 - 45, e.dogX + 5 * dt);   // 狗走進來
    if (e.t > 110 && !e.honked) { e.honked = true; sfx.horn(); }      // 喇叭
    if (e.t > 140) e.carX -= 22 * dt;                                 // 車衝過來
    if (!e.crashed && e.carX < e.dogX + 70) { e.crashed = true; sfx.crash(); }
    if (e.crashed) e.flat = Math.min(1, e.flat + 0.25 * dt);
    if (e.crashed && e.carX < -400 && !e.fading) {
      e.fading = true;
      setTimeout(() => { $('fade').style.opacity = '1'; }, 1800);
      setTimeout(exitGame, 3300);
    }
  }

  function drawCar(x) {
    ctx.save(); ctx.translate(x, GROUND);
    // 速度線
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(250 + i * 10, -20 - i * 14); ctx.lineTo(320 + i * 25, -20 - i * 14); ctx.stroke(); }
    ctx.fillStyle = '#d6332b';
    ctx.beginPath(); ctx.roundRect(0, -50, 240, 36, 10); ctx.fill();
    ctx.beginPath(); ctx.roundRect(55, -88, 120, 44, 14); ctx.fill();
    ctx.fillStyle = '#bfe3ff';
    ctx.fillRect(68, -80, 44, 28); ctx.fillRect(120, -80, 44, 28);
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(0, -44, 10, 10);
    ctx.fillStyle = '#222';
    for (const wx of [50, 190]) { ctx.beginPath(); ctx.arc(wx, -14, 16, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#999';
    for (const wx of [50, 190]) { ctx.beginPath(); ctx.arc(wx, -14, 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  function renderEgg() {
    const e = egg;
    drawBackground(0);
    const walking = e.t < 90;
    drawDog(e.dogX, GROUND, { phase: walking ? e.t * 0.4 : 0, flat: e.flat, name: dogName, barking: !e.crashed && e.t > 100 && e.t < 130 });
    if (!e.crashed && e.t > 110) {
      ctx.save(); ctx.font = 'bold 22px "Microsoft JhengHei", sans-serif'; ctx.fillStyle = '#d33';
      ctx.fillText('叭叭——!', W - 160, GROUND - 120); ctx.restore();
    }
    drawCar(e.carX);
    if (e.crashed) {
      ctx.save();
      ctx.fillStyle = '#fff'; ctx.globalAlpha = Math.max(0, 1 - e.flat * 1.5);
      ctx.fillRect(0, 0, W, H); // 撞擊閃光
      ctx.restore();
      if (e.carX < e.dogX - 150) {
        ctx.save(); ctx.textAlign = 'center';
        ctx.font = 'bold 30px "Microsoft JhengHei", sans-serif'; ctx.fillStyle = '#222';
        ctx.fillText(`${dogName} 被車輾過去了……`, W / 2, GROUND - 140);
        ctx.font = '16px "Microsoft JhengHei", sans-serif'; ctx.fillStyle = '#888';
        ctx.fillText('( 隱藏結局達成 )', W / 2, GROUND - 110);
        ctx.restore();
      }
    }
  }

  function exitGame() {
    mode = 'exit';
    document.body.innerHTML = '<div id="exitScreen"><div>遊戲已退出</div><div style="font-size:14px">重新整理頁面即可重新開始</div></div>';
    try { window.close(); } catch (e) {}
  }

  // ---------- 主迴圈 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(3, (now - last) / (1000 / 60));
    last = now;
    if (mode === 'play') { update(dt); renderGame(); }
    else if (mode === 'over') renderGame();
    else if (mode === 'egg') { updateEgg(dt); renderEgg(); }
    else if (mode === 'name') { drawBackground(0); drawDog(DOG_X, GROUND); }
    if (mode !== 'exit') requestAnimationFrame(loop);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  requestAnimationFrame(loop);
  nameInput.focus();
})();
</script>
</body>
</html>
