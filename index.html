<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>黑狗汪汪</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #efeae0; color: #222;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; user-select: none;
  }
  h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: 2px; }
  #wrap { position: relative; width: 900px; max-width: 100%; }
  canvas { display: block; width: 100%; background: #fff; border: 3px solid #222; border-radius: 10px; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(255,255,255,.93); border-radius: 10px; text-align: center; padding: 16px;
  }
  .overlay h2 { margin: 0; font-size: 28px; }
  .overlay p { margin: 0; color: #555; }
  input {
    font: inherit; font-size: 20px; padding: 8px 14px; width: 240px; max-width: 80%;
    border: 2px solid #222; border-radius: 8px; text-align: center; outline: none;
  }
  input:focus { box-shadow: 0 0 0 3px #f5c542; }
  button {
    font: inherit; font-size: 18px; padding: 8px 22px; border: 2px solid #222; border-radius: 8px;
    background: #222; color: #fff; cursor: pointer;
  }
  button.secondary { background: #fff; color: #222; }
  button:hover { filter: brightness(1.15); }
  .keys { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin-top: 12px; font-size: 15px; }
  .keys span { white-space: nowrap; }
  kbd {
    display: inline-block; min-width: 26px; padding: 2px 7px; border: 2px solid #222; border-bottom-width: 4px;
    border-radius: 6px; background: #fff; font-family: inherit; font-weight: bold; text-align: center;
  }
  .hidden { display: none !important; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
  /* ---------- 手機觸控按鍵 ---------- */
  #pad { display: none; }
  .pad-group { display: flex; flex-direction: column; gap: 14px; }
  .pad-btn {
    width: 84px; height: 84px; border-radius: 50%; padding: 0; font-size: 30px; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: #222; color: #fff; border: 3px solid #222;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad-btn small { font-size: 12px; }
  .pad-btn.active { transform: scale(.92); background: #f5c542; color: #222; }

  /* 手機:遊戲畫面全螢幕,依螢幕比例調整 */
  @media (pointer: coarse) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { padding: 0; background: #fff; touch-action: none; }
    h1, .keys { display: none; }
    #wrap { position: fixed; inset: 0; width: 100%; max-width: none; }
    canvas { width: 100%; height: 100%; border: 0; border-radius: 0; }
    /* 直式:按鍵在地面下方的土地區 */
    #pad {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      height: calc(210px + env(safe-area-inset-bottom, 0px));
      justify-content: space-between; align-items: center;
      padding: 12px max(24px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
    }
    .overlay { position: fixed; inset: 0; border-radius: 0; z-index: 20; }
  }
  /* 橫式:按鍵半透明,排成一列在畫面最下方,不擋到遊戲 */
  @media (pointer: coarse) and (orientation: landscape) {
    #pad {
      height: calc(80px + env(safe-area-inset-bottom, 0px));
      padding: 7px max(20px, env(safe-area-inset-right, 0px)) calc(7px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    }
    .pad-group { flex-direction: row; gap: 14px; }
    .pad-btn { opacity: .5; width: 66px; height: 66px; font-size: 22px; }
    .pad-btn.active { opacity: .85; }
  }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  #exitScreen {
    position: fixed; inset: 0; background: #000; color: #888; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; font-size: 20px;
  }
</style>
</head>
<body>
<h1>🐕 黑狗汪汪</h1>
<div id="wrap">
  <canvas id="c" width="900" height="300"></canvas>

  <div id="nameScreen" class="overlay">
    <h2>幫你的黑狗取個名字</h2>
    <input id="nameInput" maxlength="10" placeholder="輸入名字…" autocomplete="off">
    <button id="startBtn">開始遊戲</button>
    <p>按 Enter 也可以開始</p>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h2 id="overTitle">遊戲結束</h2>
    <p id="overReason"></p>
    <p id="overScore" style="font-size:22px;color:#222"></p>
    <div style="display:flex;gap:10px">
      <button id="retryBtn">再玩一次 (Enter)</button>
      <button id="renameBtn" class="secondary">換名字</button>
    </div>
  </div>
</div>

<div class="keys">
  <span><kbd>W</kbd> 對天上的鳥吠叫 +50</span>
  <span><kbd>S</kbd> 對地上的小孩吠叫 +50</span>
  <span><kbd>Shift</kbd> 趴下躲子彈 +100</span>
  <span><kbd>Space</kbd> 跳過捕獸夾 +100</span>
</div>

<div id="pad">
  <div class="pad-group">
    <button class="pad-btn" data-code="KeyW">▲<small>吠鳥</small></button>
    <button class="pad-btn" data-code="KeyS">▼<small>吠小孩</small></button>
  </div>
  <div class="pad-group">
    <button class="pad-btn" data-code="Space">跳<small>捕獸夾</small></button>
    <button class="pad-btn" data-code="ShiftLeft">蹲<small>子彈</small></button>
  </div>
</div>

<div id="fade"></div>
<div id="safe"></div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const DOG_X = 90;
  const EGG_NAME = '姜博凱';
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  // 世界座標:W/H/GROUND 會隨螢幕大小改變(電腦固定 900x300)
  let W = 900, H = 300, GROUND = 250, SCALE = 1, SPEED_K = 1;
  const safe = { t: 0, l: 0, r: 0 };
  let clouds = [], hillOff = 0;
  const LABEL = isTouch
    ? { bird: '▲', kid: '▼', bullet: '蹲', trap: '跳', duck: '按「蹲」', jump: '按「跳」' }
    : { bird: 'W', kid: 'S', bullet: 'Shift', trap: 'Space', duck: '按 Shift 趴下', jump: '按 Space 跳過' };

  const $ = id => document.getElementById(id);
  const nameScreen = $('nameScreen'), overScreen = $('overScreen'), nameInput = $('nameInput');

  let best = 0;
  try { best = +localStorage.getItem('blackDogBest') || 0; } catch (e) {}

  // ---------- 音效 ----------
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    return actx;
  }
  function tone(freqFrom, freqTo, dur, type = 'sawtooth', vol = 0.15, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freqFrom, t);
    o.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    bark() { tone(520, 220, 0.12); tone(560, 240, 0.12, 'sawtooth', 0.15, 0.15); },
    jump() { tone(300, 600, 0.12, 'square', 0.06); },
    point() { tone(880, 1320, 0.1, 'triangle', 0.1); },
    hit() { tone(300, 60, 0.4, 'square', 0.15); },
    horn() { tone(420, 400, 0.25, 'square', 0.12); tone(420, 400, 0.35, 'square', 0.12, 0.3); },
    crash() { tone(200, 40, 0.6, 'sawtooth', 0.25); tone(900, 100, 0.3, 'square', 0.1, 0.05); },
  };

  // ---------- 畫面尺寸 ----------
  const cloudY = () => 20 + Math.random() * Math.max(40, GROUND - 200);
  function makeClouds() {
    const n = Math.max(3, Math.round((W * GROUND) / 60000));
    clouds = Array.from({ length: n }, () => ({ x: Math.random() * W, y: cloudY() }));
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    let cssW = 900, cssH = 300, newGround = 250;
    if (isTouch) {
      cssW = window.innerWidth; cssH = window.innerHeight;
      const band = $('pad').getBoundingClientRect().height;
      const groundPx = cssH - band;
      // 地面以上至少留 250 單位給遊戲,寬度至少看得到 520 單位
      SCALE = Math.min(groundPx / 250, cssW / 520);
      W = cssW / SCALE; H = cssH / SCALE;
      newGround = groundPx / SCALE;
      const cs = getComputedStyle($('safe'));
      safe.t = parseFloat(cs.paddingTop) / SCALE || 0;
      safe.l = parseFloat(cs.paddingLeft) / SCALE || 0;
      safe.r = parseFloat(cs.paddingRight) / SCALE || 0;
    } else {
      SCALE = 1; W = 900; H = 300;
    }
    // 轉向時把場上物件跟著地面移動
    const dy = newGround - GROUND;
    if (dy && g) { for (const o of g.obs) o.y += dy; for (const p of g.pops) p.y += dy; }
    GROUND = newGround;
    SPEED_K = Math.max(0.58, Math.min(1, W / 900)); // 畫面窄時速度跟著縮,反應時間不變
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr * SCALE, 0, 0, dpr * SCALE, 0, 0);
    makeClouds();
  }

  function goFullscreen() {
    if (!isTouch || document.fullscreenElement) return;
    const el = document.documentElement;
    try {
      const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el, { navigationUI: 'hide' });
      if (r && r.catch) r.catch(() => {});
    } catch (e) {}
  }

  // ---------- 狀態 ----------
  let mode = 'name';      // name | play | over | egg | exit
  let dogName = '';
  let g;                  // 遊戲狀態
  const keys = {};

  function newGame() {
    g = {
      t: 0, score: 0, speed: 6,
      dogY: 0, vy: 0, duck: false, bark: 0, barkText: '',
      obs: [], pops: [], nextSpawn: 60, lastDanger: -999,
      groundOff: 0,
      // 隱藏結局用的統計
      st: { kidScared: 0, birdScared: 0, bulletDodged: 0, trapJumped: 0, kidSkipped: 0, birdSkipped: 0 },
      firstBullet: null,  // 第一顆子彈是 'jump' 還是 'other'
      seq: [],            // 劉祐維的按鍵順序
      skunk: false, potatoOut: false, potatoNext: 0,
    };
  }

  // ---------- 輸入 ----------
  const SEQ_CODE = { KeyW: 'U', Space: 'J', KeyS: 'D', ShiftLeft: 'C', ShiftRight: 'C' };
  function press(code) {
    if (keys[code]) return; // 避免長按重複觸發
    keys[code] = true;
    if (mode === 'play') {
      if (code === 'KeyW') bark('sky');
      if (code === 'KeyS') bark('ground');
      if (code === 'Space' && g.dogY === 0) { g.vy = -12.5; sfx.jump(); }
      if (mode === 'play' && dogName === '劉祐維' && SEQ_CODE[code]) {
        // 分數高於 1440 後:上吠、跳、下吠、蹲、任意吠三次
        if (g.score > 1440) {
          g.seq.push(SEQ_CODE[code]);
          if (g.seq.length > 7) g.seq.shift();
          if (/^UJDC[UD]{3}$/.test(g.seq.join(''))) startEnding('samurai');
        } else g.seq = [];
      }
    } else if (mode === 'egg' && code === 'Space') {
      eggJump();
    } else if (mode === 'over' && code === 'Enter') {
      startPlay();
    }
  }
  function release(code) { keys[code] = false; }

  window.addEventListener('keydown', e => {
    if (document.activeElement === nameInput) return;
    if (['Space', 'ShiftLeft', 'ShiftRight', 'KeyW', 'KeyS'].includes(e.code)) e.preventDefault();
    press(e.code);
  });
  window.addEventListener('keyup', e => release(e.code));

  // 觸控按鍵
  document.querySelectorAll('.pad-btn').forEach(b => {
    const code = b.dataset.code;
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (err) {}
      b.classList.add('active');
      audio();
      press(code);
    });
    const up = () => { b.classList.remove('active'); release(code); };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submitName(); });
  $('startBtn').onclick = submitName;
  $('retryBtn').onclick = startPlay;
  $('renameBtn').onclick = () => {
    mode = 'name'; overScreen.classList.add('hidden'); nameScreen.classList.remove('hidden');
    nameInput.value = ''; nameInput.focus();
  };

  function submitName() {
    const n = nameInput.value.trim();
    if (!n) { nameInput.focus(); return; }
    dogName = n;
    audio();
    goFullscreen();
    nameInput.blur();
    nameScreen.classList.add('hidden');
    if (n === EGG_NAME) startEgg(); else startPlay();
  }

  function startPlay() {
    goFullscreen();
    newGame();
    overScreen.classList.add('hidden');
    mode = 'play';
  }

  function bark(where) {
    g.bark = 18;
    sfx.bark();
    // 找吠叫範圍內最近的目標
    const target = g.obs
      .filter(o => o.type === (where === 'sky' ? 'bird' : 'kid') && !o.scared && o.x > DOG_X - 10 && o.x < Math.min(DOG_X + 380, W))
      .sort((a, b) => a.x - b.x)[0];
    if (target) {
      target.scared = true;
      if (target.type === 'bird') g.st.birdScared++; else g.st.kidScared++;
      addScore(50, target.x, target.y - 30, where === 'sky' ? '+50 嚇跑鳥!' : '+50 嚇跑小孩!');
    }
  }

  function addScore(n, x, y, text) {
    g.score += n;
    g.pops.push({ x, y, text, life: 50 });
    sfx.point();
  }

  function gameOver(reason) {
    mode = 'over';
    sfx.hit();
    if (g.score > best) { best = g.score; try { localStorage.setItem('blackDogBest', best); } catch (e) {} }
    $('overTitle').textContent = `${dogName} 倒下了!`;
    $('overReason').textContent = reason;
    $('overScore').textContent = `分數 ${g.score}　最高分 ${best}`;
    setTimeout(() => { if (mode === 'over') overScreen.classList.remove('hidden'); }, 600);
  }

  // ---------- 生成障礙 ----------
  function spawn() {
    const r = Math.random();
    let type = r < 0.25 ? 'bird' : r < 0.5 ? 'kid' : r < 0.75 ? 'bullet' : 'trap';
    const x = W + 30;
    // 危險物抵達狗的時間要錯開,避免同時要跳又要趴
    if (type === 'bullet' || type === 'trap') {
      const v = (type === 'bullet' ? g.speed + 5 : g.speed) * SPEED_K;
      const arrive = g.t + (x - DOG_X) / v;
      if (Math.abs(arrive - g.lastDanger) < 45) type = Math.random() < 0.5 ? 'bird' : 'kid';
      else g.lastDanger = arrive;
    }
    const o = { type, x, scared: false, passed: false, ph: Math.random() * 6 };
    if (type === 'bird') { o.y = GROUND - 190 + Math.random() * 50; o.w = 36; o.h = 20; }
    if (type === 'kid') { o.y = GROUND; o.w = 24; o.h = 50; }
    if (type === 'bullet') { o.y = GROUND - 42; o.w = 22; o.h = 8; }
    if (type === 'trap') { o.y = GROUND; o.w = 44; o.h = 16; }
    g.obs.push(o);
  }

  // ---------- 更新 ----------
  function dogBox() {
    const top = g.duck ? GROUND - 26 : GROUND - 52;
    return { x1: DOG_X + 10, x2: DOG_X + 74, y1: top + g.dogY, y2: GROUND + g.dogY - 2 };
  }

  function update(dt) {
    g.t += dt;
    g.speed = Math.min(14, 6 + g.t * 0.0025);
    const sp = g.speed * SPEED_K;
    g.groundOff = (g.groundOff + sp * dt) % 40;
    hillOff += sp * 0.15 * dt;
    for (const c of clouds) { c.x -= 0.6 * dt; if (c.x < -80) { c.x = W + 60; c.y = cloudY(); } }

    // 狗的物理
    const shift = keys.ShiftLeft || keys.ShiftRight;
    g.duck = shift && g.dogY === 0;
    if (g.dogY < 0 || g.vy < 0) {
      g.vy += (shift ? 1.4 : 0.6) * dt; // 空中按 Shift 加速下墜
      g.dogY += g.vy * dt;
      if (g.dogY >= 0) { g.dogY = 0; g.vy = 0; }
    }
    if (g.bark > 0) g.bark -= dt;

    // 生成
    g.nextSpawn -= dt;
    if (g.nextSpawn <= 0) {
      spawn();
      g.nextSpawn = (55 + Math.random() * 70) * (6 / g.speed) + 20;
    }

    // 李皓哲:吠走小孩、鳥,躲過子彈、夾子各一次後出現地瓜
    const st = g.st;
    if (dogName === '李皓哲' && !g.skunk && !g.potatoOut && g.t > g.potatoNext &&
        st.kidScared && st.birdScared && st.bulletDodged && st.trapJumped) {
      g.potatoOut = true;
      g.obs.push({ type: 'potato', x: W + 30, y: GROUND - 14, w: 30, h: 18, scared: false, passed: false, ph: 0 });
    }

    const box = dogBox();
    for (const o of g.obs) {
      o.ph += 0.25 * dt;
      if (o.type === 'bullet') o.x -= (g.speed + 5) * SPEED_K * dt;
      else if (o.scared && o.type === 'bird') { o.x -= (g.speed - 2) * SPEED_K * dt; o.y -= 4 * dt; }
      else if (o.scared && o.type === 'kid') { o.x += 3 * dt; }
      else o.x -= sp * dt;

      if (o.type === 'potato' && !o.eaten) {
        if (box.x1 < o.x + o.w && box.x2 > o.x && box.y1 < o.y && box.y2 > o.y - o.h) {
          o.eaten = true; g.skunk = true;
          addScore(0, DOG_X + 10, GROUND - 90, '吃了地瓜…變成臭鼬了!');
          tone(160, 60, 0.5, 'sawtooth', 0.12);
        }
      }

      // 略過沒吠的鳥/小孩
      if ((o.type === 'bird' || o.type === 'kid') && !o.scared && !o.passed && o.x + o.w < DOG_X + 10) {
        o.passed = true;
        if (o.type === 'bird') {
          st.birdSkipped++;
        } else {
          st.kidSkipped++;
          if (dogName === '林奕丞' && st.kidScared >= 10) { startEnding('adopt', { kidX: o.x }); return; }
        }
      }

      if (o.type === 'bullet' || o.type === 'trap') {
        const ox1 = o.x, ox2 = o.x + o.w, oy1 = o.y - (o.type === 'trap' ? o.h : 0), oy2 = o.type === 'trap' ? o.y : o.y + o.h;
        if (box.x1 < ox2 && box.x2 > ox1 && box.y1 < oy2 && box.y2 > oy1) {
          if (o.type === 'trap') {
            if (dogName === '陳柏廷' && st.bulletDodged >= 5 && st.kidScared >= 5 && st.birdScared >= 5) { startEnding('angel'); return; }
            if (dogName === '李皓哲' && g.skunk) { startEnding('skunk'); return; }
          }
          gameOver(o.type === 'bullet' ? `被子彈打中了…下次記得${LABEL.duck}!` : `踩到捕獸夾了…下次記得${LABEL.jump}!`);
          return;
        }
        // 第一顆子彈經過狗身上時,記錄狗是不是在空中
        if (o.type === 'bullet' && g.firstBullet === null && box.x1 < ox2 && box.x2 > ox1) {
          g.firstBullet = g.dogY < 0 ? 'jump' : 'other';
          o.first = true;
        }
        if (!o.passed && ox2 < box.x1) {
          o.passed = true;
          if (o.type === 'bullet') st.bulletDodged++; else st.trapJumped++;
          addScore(100, DOG_X + 30, GROUND - 80, o.type === 'bullet' ? '+100 閃過子彈!' : '+100 跳過夾子!');
          if (o.first && g.firstBullet === 'jump' && dogName === '賴冠宇') { startEnding('bullets'); return; }
        }
      }
    }
    // 高藝晟:超過 1000 分後,畫面上第一隻鳥飛到狗頭上方時沒被吠 → 立刻觸發
    if (dogName === '高藝晟' && g.score > 1000) {
      if (!g.parrotTarget || g.parrotTarget.scared) {
        g.parrotTarget = g.obs.filter(o => o.type === 'bird' && !o.scared && o.x < W && o.x + o.w > DOG_X + 40)
          .sort((a, b) => a.x - b.x)[0] || null;
      }
      if (g.parrotTarget && !g.parrotTarget.scared && g.parrotTarget.x < DOG_X + 40) { startEnding('parrot'); return; }
    }
    if (dogName === '林鼎勳' && st.kidSkipped >= 10 && g.score > 2000) { startEnding('concert'); return; }
    g.obs = g.obs.filter(o => o.x > -80 && o.x < W + 200 && o.y > -50 && !o.eaten);
    if (g.potatoOut && !g.skunk && !g.obs.some(o => o.type === 'potato')) { g.potatoOut = false; g.potatoNext = g.t + 600; }
    for (const p of g.pops) { p.life -= dt; p.y -= 0.8 * dt; }
    g.pops = g.pops.filter(p => p.life > 0);
  }

  // ---------- 繪圖 ----------
  function drawBackground(groundOff) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    // 天空很高(直式)時加上太陽
    if (GROUND > 400) {
      ctx.fillStyle = '#fbe7a6';
      ctx.beginPath(); ctx.arc(W - 80 - safe.r, Math.max(90, GROUND * 0.22), 34, 0, Math.PI * 2); ctx.fill();
    }
    // 遠方山丘
    ctx.fillStyle = '#f1efe9';
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W + 10; x += 10) {
      const k = x + hillOff;
      ctx.lineTo(x, GROUND - 40 - Math.sin(k / 90) * 18 - Math.sin(k / 37) * 8);
    }
    ctx.lineTo(W, GROUND); ctx.fill();
    // 地面下的土地
    ctx.fillStyle = '#f6f1e7'; ctx.fillRect(0, GROUND + 2, W, H - GROUND);
    ctx.fillStyle = '#e6e6e6';
    for (const c of clouds) {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 34, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 20, c.y - 8, 20, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND + 1); ctx.lineTo(W, GROUND + 1); ctx.stroke();
    ctx.fillStyle = '#999';
    for (let x = -groundOff; x < W; x += 40) {
      ctx.fillRect(x, GROUND + 8, 10, 2);
      ctx.fillRect(x + 22, GROUND + 16, 5, 2);
    }
  }

  function drawSkunkTail(x, y, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#151515'; ctx.beginPath(); ctx.ellipse(0, -14, 12, 24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, -14, 4, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#151515';
  }
  // 以下配件都畫在狗的區域座標(頭在 68,-42)
  function drawShades() {
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.roundRect(63, -51, 11, 8, 2); ctx.roundRect(76, -51, 11, 8, 2); ctx.fill();
    ctx.fillRect(58, -50, 30, 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(65, -49, 3, 2); ctx.fillRect(78, -49, 3, 2);
  }
  function drawKabuto() {
    ctx.fillStyle = '#7a1616';
    ctx.beginPath(); ctx.moveTo(57, -50); ctx.lineTo(42, -30); ctx.lineTo(62, -33); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(68, -47, 15, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4e0d0d'; ctx.fillRect(51, -49, 36, 4);
    ctx.strokeStyle = '#e3b341'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(71, -58); ctx.quadraticCurveTo(64, -72, 58, -80);
    ctx.moveTo(75, -58); ctx.quadraticCurveTo(84, -72, 90, -80);
    ctx.stroke();
    ctx.fillStyle = '#e3b341'; ctx.beginPath(); ctx.arc(73, -58, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  function drawCrown() {
    ctx.fillStyle = '#f2c230';
    ctx.beginPath(); ctx.moveTo(57, -53); ctx.lineTo(57, -67); ctx.lineTo(62, -60); ctx.lineTo(67, -72);
    ctx.lineTo(72, -60); ctx.lineTo(77, -67); ctx.lineTo(77, -53); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d22'; ctx.beginPath(); ctx.arc(67, -58, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  function drawBaseball(x, y) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#d33'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x - 7, y, 5, -0.8, 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 7, y, 5, Math.PI - 0.8, Math.PI + 0.8); ctx.stroke();
  }

  function drawDog(x, y, { duck = false, phase = 0, barking = false, flat = 0, name = '', skunk = false, shades = false,
                          kabuto = false, halo = false, crown = false, ball = false, old = false, barkColor = '#222' } = {}) {
    ctx.save();
    ctx.translate(x, y);
    if (flat > 0) { ctx.translate(0, 0); ctx.scale(1 + flat * 0.4, 1 - flat * 0.88); }
    ctx.fillStyle = '#151515';
    const leg = Math.sin(phase) * 5;
    if (duck) {
      if (skunk) drawSkunkTail(-2, -14, -1.15);
      ctx.beginPath(); ctx.ellipse(36, -12, 34, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(70, -14, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(74, -16, 16, 8);
      ctx.beginPath(); ctx.moveTo(62, -22); ctx.lineTo(56, -14); ctx.lineTo(66, -16); ctx.fill(); // 貼平的耳朵
      ctx.fillRect(14, -6, 10, 6); ctx.fillRect(50, -6, 10, 6);
      if (!skunk) {
        ctx.strokeStyle = '#151515'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(4, -12); ctx.lineTo(-10, -10); ctx.stroke();
      } else {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(72, -23); ctx.quadraticCurveTo(40, -25, 6, -18); ctx.stroke();
      }
      if (old) { ctx.fillStyle = '#8a8a8a'; ctx.fillRect(76, -16, 14, 8); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(73, -17, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d33'; ctx.fillRect(60, -12, 4, 8);
    } else {
      // 尾巴
      ctx.strokeStyle = '#151515'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      if (skunk) drawSkunkTail(8, -36, -0.45 + Math.sin(phase * 2) * 0.08);
      else { ctx.beginPath(); ctx.moveTo(10, -32); ctx.quadraticCurveTo(-4, -40, -6 + Math.sin(phase * 2) * 3, -54); ctx.stroke(); }
      // 腿
      ctx.fillRect(14 + leg, -18, 8, 18); ctx.fillRect(24 - leg, -18, 8, 18);
      ctx.fillRect(50 - leg, -18, 8, 18); ctx.fillRect(58 + leg, -18, 8, 18);
      // 身體
      ctx.beginPath(); ctx.ellipse(38, -28, 30, 13, 0, 0, Math.PI * 2); ctx.fill();
      // 頭
      ctx.beginPath(); ctx.arc(68, -42, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(72, -44, 16, barking ? 6 : 10);
      if (barking) { ctx.save(); ctx.translate(72, -36); ctx.rotate(0.35); ctx.fillRect(0, 0, 15, 4); ctx.restore(); }
      // 耳朵
      ctx.beginPath(); ctx.moveTo(60, -52); ctx.lineTo(56, -66); ctx.lineTo(68, -54); ctx.fill();
      // 眼睛、鼻子、項圈
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(72, -46, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#555'; ctx.fillRect(85, -45, 4, 4);
      ctx.fillStyle = '#d33'; ctx.fillRect(56, -38, 6, 12);
      ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(60, -25, 3, 0, Math.PI * 2); ctx.fill();
      if (skunk) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(67, -55); ctx.quadraticCurveTo(40, -46, 12, -38); ctx.stroke();
      }
      if (old) { ctx.fillStyle = '#8a8a8a'; ctx.fillRect(77, -44, 11, barking ? 6 : 10); ctx.fillRect(66, -52, 8, 3); }
      if (shades) drawShades();
      if (kabuto) drawKabuto();
      if (crown) drawCrown();
      if (ball) drawBaseball(93, -39);
      if (halo) {
        ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(66, -66, 13, 4, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.restore();

    if (barking && !flat) {
      ctx.save();
      ctx.font = 'bold 20px "Microsoft JhengHei", sans-serif';
      ctx.fillStyle = barkColor;
      ctx.fillText('汪!汪!', x + 92, y + (duck ? -18 : -54));
      ctx.restore();
    }
    if (name) {
      ctx.save();
      ctx.font = '13px "Microsoft JhengHei", sans-serif';
      ctx.fillStyle = '#666'; ctx.textAlign = 'center';
      ctx.fillText(name, x + 40, y + (duck ? -32 : flat ? -14 : -72));
      ctx.restore();
    }
  }

  function drawBird(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    const flap = Math.sin(o.ph * (o.scared ? 2 : 1)) * 10;
    ctx.fillStyle = '#4a7bd1';
    ctx.beginPath(); ctx.ellipse(18, 0, 15, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -3, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f0a020'; ctx.beginPath(); ctx.moveTo(-3, -4); ctx.lineTo(-10, -1); ctx.lineTo(-3, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(3, -5, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2f5aa8'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(24, -6 - flap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(40, -3); ctx.stroke();
    if (o.scared) { ctx.fillStyle = '#d33'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('!!', 10, -16); }
    else { ctx.fillStyle = '#bbb'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(LABEL.bird, 14, -14); }
    ctx.restore();
  }

  function drawKid(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    const step = Math.sin(o.ph) * 4;
    ctx.fillStyle = '#334';
    ctx.fillRect(4 + step, -16, 6, 16); ctx.fillRect(14 - step, -16, 6, 16);
    ctx.fillStyle = o.shirt || (o.scared ? '#e06060' : '#3aa36b');
    ctx.fillRect(2, -36, 20, 22);
    ctx.fillStyle = '#f2c9a0';
    ctx.beginPath(); ctx.arc(12, -44, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(3, -54, 18, 5);
    ctx.fillStyle = '#222';
    if (o.scared) {
      ctx.fillRect(13, -46, 3, 3); // 轉身逃跑,只看到一隻眼
      ctx.fillStyle = '#5ab0ff'; ctx.beginPath(); ctx.arc(18, -40 + (o.ph % 3) * 3, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d33'; ctx.font = 'bold 13px "Microsoft JhengHei", sans-serif'; ctx.fillText('哇~', 20, -58);
    } else {
      ctx.fillRect(6, -46, 2.5, 2.5); ctx.fillRect(11, -46, 2.5, 2.5);
      if (!o.noLabel) { ctx.fillStyle = '#bbb'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(LABEL.kid, 8, -60); }
    }
    ctx.restore();
  }

  function drawPotato(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.rotate(Math.sin(o.ph * 0.5) * 0.15);
    ctx.fillStyle = '#9b3f6b';
    ctx.beginPath(); ctx.ellipse(15, -8, 16, 8, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f2b544';
    ctx.beginPath(); ctx.ellipse(28, -11, 4, 5, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6e2a4b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(10, -8); ctx.moveTo(14, -4); ctx.lineTo(18, -3); ctx.stroke();
    ctx.fillStyle = '#bbb'; ctx.font = 'bold 11px "Microsoft JhengHei", sans-serif'; ctx.fillText('地瓜', 3, -22);
    ctx.restore();
  }

  function drawBullet(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(26 + i * 8, 1 + i * 3); ctx.lineTo(40 + i * 12, 1 + i * 3); ctx.stroke(); }
    ctx.fillStyle = '#c89b3c'; ctx.fillRect(6, 0, 16, 8);
    ctx.fillStyle = '#8a8a8a';
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.quadraticCurveTo(-4, 4, 6, 8); ctx.fill();
    ctx.fillStyle = '#bbb'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(LABEL.bullet, 0, -6);
    ctx.restore();
  }

  function drawTrap(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.fillStyle = '#666'; ctx.fillRect(0, -4, o.w, 4);
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.moveTo(2, -4);
    for (let i = 0; i <= 6; i++) ctx.lineTo(2 + i * 6.6 + 3.3, i % 2 ? -16 : -8);
    ctx.lineTo(o.w - 2, -4); ctx.fill();
    ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.w / 2, -4, 18, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#bbb'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(LABEL.trap, 4, -26);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    // 直式時把分數放在靠近遊戲區的位置,不要放在螢幕最頂端
    const top = Math.max(28 + safe.t, GROUND - 320), left = 16 + safe.l, right = W - 16 - safe.r;
    ctx.font = 'bold 18px "Microsoft JhengHei", monospace';
    ctx.fillStyle = '#222'; ctx.textAlign = 'right';
    ctx.fillText(`分數 ${String(g.score).padStart(5, '0')}`, right, top);
    ctx.fillStyle = '#888';
    ctx.fillText(`最高 ${String(Math.max(best, g.score)).padStart(5, '0')}`, right, top + 22);
    ctx.textAlign = 'left'; ctx.fillStyle = '#222';
    ctx.fillText(`🐕 ${dogName}`, left, top);
    ctx.restore();
    for (const p of g.pops) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life / 20);
      ctx.font = 'bold 16px "Microsoft JhengHei", sans-serif';
      ctx.fillStyle = p.text.includes('100') ? '#d9822b' : '#2f8f5b';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }

  function renderGame() {
    drawBackground(g.groundOff);
    for (const o of g.obs) {
      if (o.type === 'bird') drawBird(o);
      else if (o.type === 'kid') drawKid(o);
      else if (o.type === 'trap') drawTrap(o);
      else if (o.type === 'potato') drawPotato(o);
    }
    drawDog(DOG_X, GROUND + g.dogY, {
      duck: g.duck, phase: g.dogY === 0 && mode === 'play' ? g.t * 0.45 : 0, barking: g.bark > 0, skunk: g.skunk,
    });
    for (const o of g.obs) if (o.type === 'bullet') drawBullet(o);
    drawHUD();
  }

  // ---------- 彩蛋:被車輾過 ----------
  let egg;
  function startEgg() {
    mode = 'egg';
    egg = { t: 0, dogX: -100, carX: W + 260, flat: 0, honked: false, crashed: false, fading: false,
            jumps: 0, saved: false, dogY: 0, vy: 0, grav: 0.6, launched: false, launchT: 0, apex: 0, caught: false, landT: 0 };
  }

  // 姜博凱:車撞上之前按滿 5 次跳躍,就會跳過汽車
  function eggJump() {
    const e = egg;
    if (e.crashed || e.launched) return;
    if (!e.saved && ++e.jumps >= 5) { e.saved = true; sfx.point(); }
    if (e.dogY === 0) { e.vy = -6; e.grav = 0.6; sfx.jump(); }
  }

  function updateEgg(dt) {
    const e = egg;
    e.t += dt;
    if (e.t < 90) e.dogX = Math.min(W / 2 - 45, e.dogX + 5 * dt);   // 狗走進來
    if (e.t > 110 && !e.honked) { e.honked = true; sfx.horn(); }      // 喇叭
    if (e.t > 140) e.carX -= 22 * dt;                                 // 車衝過來
    if (e.saved && !e.launched && e.t > 140 && e.carX - (e.dogX + 70) < 270) {
      e.launched = true; e.launchT = e.t; e.vy = -11.5; e.grav = 0.45;
      e.apex = e.dogY - (11.5 * 11.5) / (2 * 0.45);
      sfx.jump(); tone(400, 900, 0.3, 'square', 0.08);
    }
    if (e.dogY < 0 || e.vy < 0) {
      e.vy += e.grav * dt; e.dogY += e.vy * dt;
      if (e.dogY >= 0) { e.dogY = 0; e.vy = 0; if (e.caught && !e.landT) e.landT = e.t; }
    }
    if (e.launched && !e.caught && e.t - e.launchT >= 25) { e.caught = true; sfx.point(); tone(1200, 1600, 0.15, 'triangle', 0.1, 0.1); }
    if (e.landT && e.t - e.landT > 70) { startEnding('mlb'); return; }
    if (!e.saved && !e.crashed && e.carX < e.dogX + 70) { e.crashed = true; sfx.crash(); }
    if (e.crashed) e.flat = Math.min(1, e.flat + 0.25 * dt);
    if (e.crashed && e.carX < -400 && !e.fading) {
      e.fading = true;
      setTimeout(() => { $('fade').style.opacity = '1'; }, 1800);
      setTimeout(exitGame, 3300);
    }
  }

  function drawCar(x) {
    ctx.save(); ctx.translate(x, GROUND);
    // 速度線
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(250 + i * 10, -20 - i * 14); ctx.lineTo(320 + i * 25, -20 - i * 14); ctx.stroke(); }
    ctx.fillStyle = '#d6332b';
    ctx.beginPath(); ctx.roundRect(0, -50, 240, 36, 10); ctx.fill();
    ctx.beginPath(); ctx.roundRect(55, -88, 120, 44, 14); ctx.fill();
    ctx.fillStyle = '#bfe3ff';
    ctx.fillRect(68, -80, 44, 28); ctx.fillRect(120, -80, 44, 28);
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(0, -44, 10, 10);
    ctx.fillStyle = '#222';
    for (const wx of [50, 190]) { ctx.beginPath(); ctx.arc(wx, -14, 16, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#999';
    for (const wx of [50, 190]) { ctx.beginPath(); ctx.arc(wx, -14, 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  function renderEgg() {
    const e = egg;
    drawBackground(0);
    const walking = e.t < 90;
    drawDog(e.dogX, GROUND + e.dogY, { phase: walking ? e.t * 0.4 : 0, flat: e.flat, name: dogName, ball: e.caught,
      barking: !e.crashed && !e.caught && e.t > 100 && e.t < 130 });
    if (e.launched && !e.caught) {
      const p = Math.min(1, (e.t - e.launchT) / 25);
      ctx.save(); drawBaseball(lerp(W + 20, e.dogX + 93, p), lerp(GROUND - 230, GROUND + e.apex - 39, p) - Math.sin(p * Math.PI) * 30); ctx.restore();
    }
    if (e.caught) txt('咬到了一顆棒球!', W / 2, capY(), 22, '#d9822b', { stroke: '#fff' });
    if (!e.crashed && e.t > 110 && e.carX > e.dogX) {
      ctx.save(); ctx.font = 'bold 22px "Microsoft JhengHei", sans-serif'; ctx.fillStyle = '#d33';
      ctx.fillText('叭叭——!', W - 160, GROUND - 120); ctx.restore();
    }
    drawCar(e.carX);
    if (e.crashed) {
      ctx.save();
      ctx.fillStyle = '#fff'; ctx.globalAlpha = Math.max(0, 1 - e.flat * 1.5);
      ctx.fillRect(0, 0, W, H); // 撞擊閃光
      ctx.restore();
      if (e.carX < e.dogX - 150) {
        ctx.save(); ctx.textAlign = 'center';
        ctx.font = 'bold 30px "Microsoft JhengHei", sans-serif'; ctx.fillStyle = '#222';
        ctx.fillText(`${dogName} 被車輾過去了……`, W / 2, GROUND - 140);
        ctx.font = '16px "Microsoft JhengHei", sans-serif'; ctx.fillStyle = '#888';
        ctx.fillText('( 隱藏結局達成 )', W / 2, GROUND - 110);
        ctx.restore();
      }
    }
  }

  // =====================================================================
  // ---------- 隱藏結局 ----------
  // =====================================================================
  const FONT = '"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';
  const lerp = (a, b, p) => a + (b - a) * p;
  const clamp01 = p => Math.max(0, Math.min(1, p));
  const prog = (t, a, b) => clamp01((t - a) / (b - a));
  const ease = p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  const capY = () => GROUND + 32;                                  // 字幕放在地面下的土地區
  const cardY = () => Math.max(70 + safe.t, GROUND * 0.38);

  // 文字超出寬度時自動縮小
  function txt(s, x, y, size, color = '#222', o = {}) {
    const maxW = o.maxW || W - 32 - safe.l - safe.r;
    ctx.save();
    const weight = o.weight || 'bold', fam = o.family || FONT;
    ctx.font = `${weight} ${size}px ${fam}`;
    const w = ctx.measureText(s).width;
    if (w > maxW) ctx.font = `${weight} ${Math.max(9, size * maxW / w)}px ${fam}`;
    ctx.textAlign = o.align || 'center';
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = 16; }
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = color; ctx.fillText(s, x, y);
    ctx.restore();
  }
  const caption = (s, a = 1) => txt(s, W / 2, capY(), 20, '#222', { stroke: '#fff', alpha: a });

  function bubble(s, x, y, size = 13) {
    ctx.save();
    ctx.font = `bold ${size}px ${FONT}`;
    const w = ctx.measureText(s).width + 14, h = size + 12;
    const bx = Math.max(4, Math.min(W - w - 4, x - w / 2));
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, y - h, w, h, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 4, y - 1); ctx.lineTo(x + 4, y - 1); ctx.lineTo(x, y + 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.fillText(s, bx + w / 2, y - 7);
    ctx.restore();
  }

  function drawHeart(x, y, s, color = '#ff5d7a', a = 1) {
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = color;

    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    ctx.fill(); ctx.restore();

  function cloud(x, y, s = 1, color = '#fff') {

  function drawAngel(x, y, ph) {

  function drawHouse(x) {
    const y = GROUND;

    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillStyle = '#9a6a4a'; ctx.fillRect(x + 118, y - 152, 16, 36);
    ctx.fillStyle = '#f4d7a1'; ctx.fillRect(x, y - 100, 160, 100); ctx.strokeRect(x, y - 100, 160, 100);
    ctx.fillStyle = '#c0473a'; ctx.beginPath(); ctx.moveTo(x - 16, y - 98); ctx.lineTo(x + 80, y - 160); ctx.lineTo(x + 176, y - 98); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8a5a3b'; ctx.fillRect(x + 64, y - 56, 32, 56);
    ctx.fillStyle = '#ffe58a'; ctx.fillRect(x + 14, y - 82, 36, 28); ctx.fillRect(x + 110, y - 82, 36, 28);
    ctx.strokeRect(x + 14, y - 82, 36, 28); ctx.strokeRect(x + 110, y - 82, 36, 28);
    ctx.beginPath(); ctx.moveTo(x + 32, y - 82); ctx.lineTo(x + 32, y - 54); ctx.moveTo(x + 128, y - 82); ctx.lineTo(x + 128, y - 54); ctx.stroke();

  function drawBulletAt(x, y, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(18 + i * 8, -3 + i * 3); ctx.lineTo(34 + i * 12, -3 + i * 3); ctx.stroke(); }
    ctx.fillStyle = '#c89b3c'; ctx.fillRect(-2, -4, 16, 8);

  // 結局設定:分數與長度(影格,60fps)
  const ENDINGS = {
    parrot:  { score: 1580000, len: 420 },
    adopt:   { score: 1450000, len: 640 },
    bullets: { score: 1490000, len: 560 },
    concert: { score: 1470000, len: 760 },
    angel:   { score: 1570000, len: 640 },
    samurai: { score: 1440000, len: 600 },
    skunk:   { score: 1480000, len: 680 },
    mlb:     { score: 1500000, len: 140 },
  };
  let end = null;

  function startEnding(id, opts = {}) {
    const cfg = ENDINGS[id];
    mode = 'ending';
    end = { id, t: 0, score: cfg.score, len: cfg.len, flags: {}, ...opts };
    if (g) g.score = cfg.score;
    if (cfg.score > best) { best = cfg.score; try { localStorage.setItem('blackDogBest', best); } catch (e) {} }
    for (const k in keys) keys[k] = false;
    document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('active'));
    $('pad').style.visibility = 'hidden';
    if (id === 'bullets') end.bul = buildBullets();
    tone(660, 990, 0.18, 'triangle', 0.1); tone(990, 1320, 0.25, 'triangle', 0.1, 0.15);
  }
  const once = (k, fn) => { if (!end.flags[k]) { end.flags[k] = 1; fn(); } };

  function updateEnding(dt) {
    end.t += dt;
    if (end.t > end.len + 170) once('fade', () => { $('fade').style.opacity = '1'; });
    if (end.t > end.len + 260) exitGame();
  }

  function scoreCard(y, a) {
    ctx.save(); ctx.globalAlpha = a;
    const w = Math.min(W - 32, 420), h = 100;
    ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, y - h / 2, w, h, 12); ctx.fill(); ctx.stroke();
    ctx.restore();
    txt('★ 隱藏結局達成 ★', W / 2, y - 14, 20, '#d9822b', { alpha: a, maxW: w - 20 });
    txt(`分數 ${end.score}`, W / 2, y + 28, 32, '#222', { alpha: a, maxW: w - 20 });
  }

  function renderEnding(dt) {
    const t = end.t;
    ({ parrot: sceneParrot, adopt: sceneAdopt, bullets: sceneBullets, concert: sceneConcert,
       angel: sceneAngel, samurai: sceneSamurai, skunk: sceneSkunk, mlb: sceneMLB })[end.id](t, dt);
    if (t < 14) { ctx.save(); ctx.globalAlpha = 1 - t / 14; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    if (t > end.len) {
      once('done', () => { tone(523, 523, 0.2, 'triangle', 0.1); tone(659, 659, 0.2, 'triangle', 0.1, 0.18); tone(784, 784, 0.4, 'triangle', 0.1, 0.36); });
      scoreCard(end.id === 'mlb' ? H / 2 + Math.min(H * 0.3, 150) : cardY(), prog(t, end.len, end.len + 20));
    }
  }

  // ---- 高藝晟:鸚鵡帶上天空看彩虹 ----
  function sceneParrot(t) {
    const lift = ease(prog(t, 130, 330));
    const camY = lift * GROUND * 0.9;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = prog(t, 120, 300); fillSky([[0, '#6fbdf0'], [1, '#d8f0ff']]); ctx.restore();
    const ra = prog(t, 250, 340);
    if (ra > 0) drawRainbow(W / 2, GROUND, Math.min(W * 0.46, GROUND * 0.82), ra);
    for (let i = 0; i < 6; i++) {
      const span = GROUND + 80;
      const cy = ((i * 97 + camY * 0.8) % span) - 40;
      cloud((i * W / 6 + 50) % W, cy, 0.9, '#f0f0f0');
    }
    if (camY < H) plainGround(GROUND + camY);
    const dx = W * 0.38 - 45;
    const dy = GROUND - lift * GROUND * 0.4 + Math.sin(t * 0.08) * 4 * lift;
    drawDog(dx, dy, { phase: t * 0.25 * lift, barking: t > 330 && t < 360 });
    const spots = [[-22, -82], [18, -96], [58, -100], [98, -84], [-52, -54], [128, -54]];
    spots.forEach(([ox, oy], i) => {
      const p = ease(prog(t, 10 + i * 12, 70 + i * 12));
      const sx = i % 2 ? W + 60 : -60, sy = dy - 160;
      const px = lerp(sx, dx + ox, p), py = lerp(sy, dy + oy, p) + Math.sin(t * 0.15 + i) * 3;
      drawParrot(px, py, t * 0.6 + i, PARROT_C[i % 4]);
      if (t > 70 && t < 300 && Math.floor((t + i * 20) / 40) % 2 === 0) bubble('你好棒!', px, py - 14, 12);
    });
    if (t > 60 && t < 300) once('c' + Math.floor(t / 22), () => tone(1800 + Math.random() * 600, 2600, 0.08, 'sine', 0.05));
    if (t < 130) caption('鸚鵡們:「你好棒!你好棒!」');
    else if (t < 330) caption(`鸚鵡們把 ${dogName} 帶上了天空…`);
    else if (t < end.len) caption(`${dogName} 看到了彩虹 🌈`);
  }

  // ---- 林奕丞:被小朋友領養 ----
  function drawRoom(t) {
    fillSky([[0, '#f9dfb4'], [1, '#f0c389']]);
    ctx.fillStyle = '#b97a48'; ctx.fillRect(0, GROUND, W, H - GROUND + 10);
    ctx.strokeStyle = '#9c6236'; ctx.lineWidth = 2;
    for (let y = GROUND + 14; y < H; y += 16) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    const wx = Math.max(16 + safe.l, W * 0.1), wy = Math.max(20 + safe.t, GROUND - 200);
    ctx.fillStyle = '#1d2650'; ctx.fillRect(wx, wy, 110, 80);
    ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(wx + 80, wy + 24, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1d2650'; ctx.beginPath(); ctx.arc(wx + 85, wy + 20, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    for (const [sx, sy] of [[18, 16], [40, 40], [60, 14], [26, 60], [90, 62]]) if (Math.sin(t * 0.1 + sx) > -0.5) ctx.fillRect(wx + sx, wy + sy, 2, 2);
    ctx.strokeStyle = '#7a4d2b'; ctx.lineWidth = 6; ctx.strokeRect(wx, wy, 110, 80);
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(wx + 55, wy); ctx.lineTo(wx + 55, wy + 80); ctx.stroke();
    const fx = W - Math.max(16 + safe.r, W * 0.06) - 120;
    ctx.fillStyle = '#a8503a'; ctx.fillRect(fx, GROUND - 92, 120, 92);
    ctx.fillStyle = '#6e3326'; ctx.fillRect(fx - 8, GROUND - 100, 136, 10);
    ctx.fillStyle = '#1a1010'; ctx.beginPath(); ctx.roundRect(fx + 22, GROUND - 62, 76, 62, [30, 30, 0, 0]); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const fl = Math.sin(t * 0.3 + i * 2) * 5;
      ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.ellipse(fx + 42 + i * 18, GROUND - 16, 9, 18 + fl, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd34a'; ctx.beginPath(); ctx.ellipse(fx + 42 + i * 18, GROUND - 10, 5, 10 + fl * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#c23b3b'; ctx.beginPath(); ctx.ellipse(W * 0.5, GROUND + 6, Math.min(W * 0.22, 150), 10, 0, 0, Math.PI * 2); ctx.fill();
  }
  function sceneAdopt(t, dt) {
    if (t < 300) {
      const walking = t > 150;
      if (walking) hillOff += 2 * dt;
      drawBackground(walking ? (t * 4) % 40 : 0);
      const houseX = lerp(W + 60, W * 0.62, ease(prog(t, 160, 290)));
      if (walking) drawHouse(houseX);
      const kx = lerp(Math.max(-30, end.kidX), DOG_X - 36, ease(prog(t, 0, 40)));
      drawDog(DOG_X, GROUND, { phase: walking ? t * 0.4 : 0, barking: t > 115 && t < 135 });
      drawKid({ x: kx, y: GROUND, ph: walking || t < 40 ? t * 0.3 : 0, scared: false, noLabel: true });
      if (t > 40 && t < 150) {
        ctx.save(); ctx.strokeStyle = '#f2c9a0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(kx + 20, GROUND - 32); ctx.lineTo(DOG_X + 30 + Math.sin(t * 0.3) * 6, GROUND - 42); ctx.stroke(); ctx.restore();
        drawHeart(DOG_X + 40, GROUND - 80 - ((t - 40) % 40), 12, '#ff5d7a', 1 - ((t - 40) % 40) / 40);
      }
      if (t > 30 && t < 90) bubble('你好可愛…', kx + 12, GROUND - 64);
      if (t > 90 && t < 150) bubble('跟我回家好不好?', kx + 12, GROUND - 64);

  // ---- 賴冠宇:四面八方的子彈 ----
  function buildBullets() {
    const P = Math.PI;
    const list = [[0, 'jump'], [P, 'jump'], [-P / 4, 'leanL'], [-3 * P / 4, 'leanR'], [-P / 2, 'leanL'],
                  [0, 'duck'], [P, 'duck'], [-P / 8, 'jump'], [-7 * P / 8, 'jump'], [-P / 2, 'leanR']];
    const out = list.map(([a, d], i) => ({ a, d, at: 80 + i * 32 }));
    for (const a of [0, P, -P / 12, -11 * P / 12]) out.push({ a, d: 'big', at: 440 });
    return out;
  }
  function sceneBullets(t) {
    drawBackground(0);
    ctx.save(); ctx.globalAlpha = 0.08 + Math.sin(t * 0.2) * 0.04; ctx.fillStyle = '#d33'; ctx.fillRect(0, 0, W, H); ctx.restore();
    const bx = W / 2 - 40;
    let ox = 0, oy = 0, duck = false;
    for (const b of end.bul) {
      const dp = (t - (b.at - 16)) / 32;
      if (dp <= 0 || dp >= 1) continue;
      const s = Math.sin(dp * Math.PI);
      if (b.d === 'jump') oy = Math.min(oy, -110 * s);
      else if (b.d === 'big') oy = Math.min(oy, -150 * s);
      else if (b.d === 'leanL') ox = -95 * s;
      else if (b.d === 'leanR') ox = 95 * s;
      else duck = true;
    }
    const sunglassesOn = t >= 520;
    drawDog(bx + ox, GROUND + oy, { duck, shades: sunglassesOn, phase: 0, barking: t > 530 && t < 550 });
    if (t >= 470 && t < 520) {
      const p = ease(prog(t, 470, 520));
      ctx.save(); ctx.translate(bx, lerp(-60, GROUND, p)); ctx.rotate((1 - p) * 3); drawShades(); ctx.restore();
    }
    const R = Math.hypot(W, H) * 0.6, TR = 40;
    let dodged = 0;
    for (const b of end.bul) {
      const p = (t - (b.at - TR)) / TR;
      if (t >= b.at + 4) dodged++;
      if (p <= 0 || p > 2.6) continue;
      once('w' + b.at + b.a, () => tone(1400, 300, 0.25, 'square', 0.04));
      const tx = W / 2, ty = GROUND - (b.d === 'duck' ? 44 : 28);
      const sx = tx + Math.cos(b.a) * R, sy = ty + Math.sin(b.a) * R;
      const x = lerp(sx, tx, p), y = lerp(sy, ty, p);
      if (y < GROUND) drawBulletAt(x, y, b.a);
      if (t > b.at && t < b.at + 24) txt('閃!', W / 2 + 70, GROUND - 120 - (t - b.at), 22, '#d9822b', { stroke: '#fff', alpha: 1 - (t - b.at) / 24 });
    }
    if (t < 60) caption('四面八方都有子彈射過來了!!');
    else if (t < 470) caption(`閃過子彈 ${dodged} / ${end.bul.length}`);
    else if (t < end.len) caption(`😎 ${dogName}:「小意思。」`);
  }

  // ---- 林鼎勳:演唱會 ----
  function playSong() {
    const mel = [0, 2, 4, 7, 9, 7, 4, 2, 0, 2, 4, 4, 2, 0, 2, -3, 0, 2, 4, 7, 9, 12, 9, 7, 4, 7, 4, 2, 0, -3, 0];
    const beat = 0.32;
    mel.forEach((n, i) => {
      const f = 523.25 * Math.pow(2, n / 12);
      tone(f, f * 1.001, beat * 0.9, 'triangle', 0.08, i * beat);
      if (i % 2 === 0) { const b = 130.8 * Math.pow(2, [0, 5, 7, 0][(i / 2 | 0) % 4] / 12); tone(b, b * 1.001, beat * 1.8, 'sine', 0.06, i * beat); }
    });
  }
  function sceneConcert(t, dt) {

      for (let i = 0; i < 5; i++) {
        const tx = DOG_X + 96 + i * 34 + run * 5;
        const x = lerp(W + 30 + i * 40, tx, ease(prog(t, 0, 60)));
        drawKid({ x, y: GROUND, ph: t < 60 || run ? t * 0.4 + i : 0, scared: false, noLabel: true, shirt: KID_C[i] });
      }
      if (t > 40 && t < 130) bubble('一起去看演唱會吧!', DOG_X + 150, GROUND - 70);
      caption(`一群小朋友把 ${dogName} 帶到了演唱會現場…`);

    }

    ['rgba(255,122,182,.16)', 'rgba(110,170,255,.16)', 'rgba(255,220,110,.16)'].forEach((c, i) => {
      const sx = W * (0.2 + 0.3 * i), sw = Math.sin(t * 0.03 + i * 2) * W * 0.12;

      ctx.moveTo(sx - 6, 0); ctx.lineTo(sx + 6, 0); ctx.lineTo(sx + sw + 70, stageTop); ctx.lineTo(sx + sw - 70, stageTop); ctx.closePath(); ctx.fill();
    });

    ctx.fillStyle = '#2c2450'; ctx.fillRect(0, stageTop, W, H - stageTop);

    for (let i = 0; i < 7; i++) {
      const k = ((s * 0.7 + i * 37) % 160) / 160;

    }
    for (let x = 10, i = 0; x < W + 20; x += 28, i++) {

      ctx.fillStyle = '#05040c'; ctx.beginPath(); ctx.arc(x, hy, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 15, hy + 8, 30, H);

    if (s > 380) {

  // ---- 李皓哲:臭鼬稱王 ----
  function sceneSkunk(t) {

      ctx.save(); ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);

      if (t < 100) drawClosedTrap(DOG_X + 18, GROUND);

  // ---- 姜博凱:報紙頭條 ----
  function sceneMLB(t) {
    drawBackground(0);

    const p = ease(prog(t, 0, 50));
    ctx.save(); ctx.globalAlpha = 0.4 * p; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();

    ctx.fillStyle = '#f3eedf'; ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    ctx.fillRect(-pw / 2, -ph / 2, pw, ph); ctx.strokeRect(-pw / 2, -ph / 2, pw, ph);
    const T = -ph / 2, L = -pw / 2 + 16, inner = pw - 32;
    txt('汪 汪 日 報', 0, T + ph * 0.12, Math.min(ph * 0.11, 46), '#111', { maxW: inner, family: '"PMingLiU", "Songti TC", serif' });
    const d = new Date();
    txt(`${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 號外`, 0, T + ph * 0.175, Math.min(ph * 0.035, 14), '#555', { maxW: inner, weight: 'normal' });
    ctx.fillStyle = '#222'; ctx.fillRect(L, T + ph * 0.195, inner, 3); ctx.fillRect(L, T + ph * 0.205, inner, 1);
    txt('第一個進入大聯盟的黑狗!', 0, T + ph * 0.3, Math.min(ph * 0.085, 40), '#b3202a', { maxW: inner });
    const bxw = inner * 0.5, bxh = ph * 0.54, bxx = L, bxy = T + ph * 0.36;
    ctx.save();
    ctx.beginPath(); ctx.rect(bxx, bxy, bxw, bxh); ctx.clip();
    ctx.fillStyle = '#d9d4c4'; ctx.fillRect(bxx, bxy, bxw, bxh);
    const gy = bxy + bxh * 0.86;
    ctx.fillStyle = '#c2bca9'; ctx.fillRect(bxx, gy, bxw, bxh);
    const sc = Math.min(bxw / 260, bxh / 200);
    ctx.translate(bxx + bxw * 0.5, gy); ctx.scale(sc, sc);
    drawCarSmall();
    drawDog(-40, -120, { ball: true, phase: 1 });
    ctx.restore();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.strokeRect(bxx, bxy, bxw, bxh);
    const rx = bxx + bxw + 12, rw = inner - bxw - 12;
    const ls = Math.min(ph * 0.04, 15);
    txt(`「${dogName}」飛身躍過汽車`, rx, bxy + ls + 2, ls + 1, '#222', { align: 'left', maxW: rw });
    txt('一口咬住全壘打球!', rx, bxy + ls * 2.6, ls + 1, '#222', { align: 'left', maxW: rw });
    txt('球探:「牠是天生的外野手。」', rx, bxy + ls * 4.2, ls, '#555', { align: 'left', maxW: rw, weight: 'normal' });
    ctx.fillStyle = '#bdb6a2';
    for (let y = bxy + ls * 5.4, i = 0; y < bxy + bxh - 4; y += ls * 1.1, i++) ctx.fillRect(rx, y, rw * (i % 4 === 3 ? 0.6 : 1), Math.max(2, ls * 0.4));
    ctx.restore();
  }
  function drawCarSmall() {
    ctx.fillStyle = '#777';
    ctx.beginPath(); ctx.roundRect(-110, -50, 220, 36, 10); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-60, -86, 110, 40, 14); ctx.fill();
    ctx.fillStyle = '#222';
    for (const wx of [-70, 70]) { ctx.beginPath(); ctx.arc(wx, -14, 15, 0, Math.PI * 2); ctx.fill(); }
  }

  function exitGame() {
    mode = 'exit';
    document.body.innerHTML = '<div id="exitScreen"><div>遊戲已退出</div><div style="font-size:14px">重新整理頁面即可重新開始</div></div>';
    try { window.close(); } catch (e) {}
  }

  // ---------- 主迴圈 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(3, (now - last) / (1000 / 60));
    last = now;
    if (mode === 'play') { update(dt); renderGame(); }
    else if (mode === 'over') renderGame();
    else if (mode === 'egg') { updateEgg(dt); if (mode === 'egg') renderEgg(); }
    else if (mode === 'ending') { updateEnding(dt); if (mode === 'ending') renderEnding(dt); }
    else if (mode === 'name') { drawBackground(0); drawDog(DOG_X, GROUND); }
    if (mode !== 'exit') requestAnimationFrame(loop);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  requestAnimationFrame(loop);
  nameInput.focus();
})();
</script>
</body>
</html>
